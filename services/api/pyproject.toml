[project]
name = "mdi-api"
version = "0.1.0"
description = "Backend API for Multimodal Document Intelligence"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.8,<5",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langfuse>=4,<5",
  "langchain-text-splitters>=1,<2",
  "langgraph>=1,<2",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "pypdfium2>=5.3,<6",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ocr = [
  "paddleocr[doc-parser]>=3.3,<4",
  "paddlepaddle>=3.2,<4",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "reportlab>=4.2,<5",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires a migrated PostgreSQL database"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
exclude = ["alembic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
