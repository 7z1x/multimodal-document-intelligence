services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mdi
      POSTGRES_USER: mdi
      POSTGRES_PASSWORD: mdi
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mdi -d mdi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mdi_postgres_data:/var/lib/postgresql/data

  migrate:
    image: mdi-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["uv", "run", "alembic", "upgrade", "head"]
    environment: &api_environment
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://mdi:mdi@postgres:5432/mdi
      STORAGE_DIR: /app/storage/documents
      AUDIT_LOG_DIR: /app/storage/audit-logs
      EXTRACTION_BACKEND: ${EXTRACTION_BACKEND:-heuristic}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-http://host.docker.internal:4096}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://host.docker.internal:3001}
      CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    image: mdi-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment: *api_environment
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - mdi_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "uv",
          "run",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  mdi_postgres_data:
  mdi_storage:
